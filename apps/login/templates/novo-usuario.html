{% extends 'base-login.html' %}
{% block title %}Novo usuário{% endblock %}
{% block content %}
  <h2 class="mb-1">Criar conta</h2>
  <p class="text-muted-2 mb-4">Cadastre um novo analista de suporte.</p>

  {% if error %}<div class="alert-erro"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>{% endif %}

  <form action="" method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label for="username" class="form-label">Nome do usuário</label>
      <div class="input-ico">
        <i class="bi bi-person"></i>
        <input type="text" class="form-control" id="username" name="username" placeholder="seu.usuario" autocomplete="username" required autofocus>
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Senha</label>
      <div class="input-ico">
        <i class="bi bi-lock"></i>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
      </div>
    </div>
    <div class="mb-4">
      <label for="confirm_password" class="form-label">Confirme a senha</label>
      <div class="input-ico">
        <i class="bi bi-shield-lock"></i>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" autocomplete="new-password" required>
      </div>
    </div>
    <button type="submit" class="btn-accent">Criar conta <i class="bi bi-arrow-right"></i></button>
  </form>
  <p class="auth-switch">Já possui cadastro? <a href="{% url 'login' %}">Faça o login</a></p>
{% endblock %}
